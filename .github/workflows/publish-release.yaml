name: Publish Release
on:
  release:
    types: [published]
env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
jobs:
  run-test:
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    name: "Test ubuntu-latest - JDK 17"
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-java@v2
      with:
        distribution: "temurin"
        java-version: "17"
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
    - name: Execute build and run all tests
      run: ./gradlew build
  publish-docker-release:
    runs-on: ubuntu-latest
    needs: run-test
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1.2.0
        with:
          platforms: all
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1.6.0
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Get Tag for Docker
        run: VERSION=$(sed 's/v//' <<< ${{ github.ref_name }}) && echo "::set-output name=tagname::$VERSION"
        id: tagname
      - name: Build and Push
        uses: docker/build-push-action@v2
        with:
          context: ./docker/
          platforms: linux/amd64,linux/arm64
          file: ./docker/Dockerfile
          tags: botic/ringojs:${{ steps.tagname.outputs.tagname }}
          push: true
